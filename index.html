<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スネークゲーム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>🐍 SNAKE</h1>
    <div class="hud">
      <div>🍎 <span id="score">0</span></div>
      <div>ハイスコア <span id="best">0</span></div>
    </div>
    <canvas id="board" aria-label="スネークゲームの盤面"></canvas>
    <p class="hint">矢印キーで移動 / Space: 開始・再開 / P: 一時停止<br>スマホはスワイプで操作</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
